name: Bug Report

description: Report a bug to help us improve

title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        Please describe the bug clearly.

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What you expected to happen

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "18.x, 20.x, etc."

  - type: input
    id: version
    attributes:
      label: agent-sync Version
      placeholder: "1.0.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      placeholder: Paste any relevant error messages here