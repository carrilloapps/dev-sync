name: Feature Request

description: Suggest a new feature or enhancement

title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        Describe the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: What problem does this solve?

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: How would you like it to work?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternatives you've considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Any other context or screenshots?